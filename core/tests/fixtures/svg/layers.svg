<?xml version="1.0" encoding="UTF-8"?>
<!-- Authored for Carvetto (T-0212): Inkscape layers, a hidden layer, defs/use and skipped content. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     xmlns:xlink="http://www.w3.org/1999/xlink" width="50mm" height="50mm" viewBox="0 0 50 50">
  <sodipodi:namedview id="base"/>
  <defs>
    <linearGradient id="g1"><stop offset="0"/></linearGradient>
    <clipPath id="c1"><rect width="5" height="5"/></clipPath>
    <rect id="tile" width="4" height="4"/>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="Outline" id="layer1">
    <rect x="1" y="1" width="48" height="48"/>
    <g transform="translate(10 10)"><circle r="3"/></g>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Holes" id="layer2">
    <use xlink:href="#tile" x="20" y="20"/>
    <use href="#tile" x="30" y="20"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Hidden" id="layer3" style="display:none">
    <rect width="10" height="10"/>
  </g>
  <text x="5" y="5">hello</text>
  <image width="5" height="5" xlink:href="data:,x"/>
  <rect x="40" y="40" width="5" height="5" clip-path="url(#c1)"/>
</svg>
