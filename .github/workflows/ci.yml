name: CI

on:
  push:
    branches: [main]
    # Backlog/ADR-only commits to main change no code: do not spend four runner jobs on them.
    paths-ignore: ['docs/**']
  pull_request:

# A newer push to the same PR branch supersedes the older run: cancel it so stale runs do not
# starve the runner queue. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # T-0146: the changelog check compares with the PR's merge base
      # T-0146: entries live in changelog.d/ (one fragment per card), never in CHANGELOG.md.
      # `check` validates the fragments; on PRs `--base` compares CHANGELOG.md byte for byte with
      # the merge base: only an unchanged file, the exact output of `assemble` for the fragments
      # the PR deletes, or one inserted `## X.Y.Z` release heading pass (see changelog.d/README.md).
      - name: Changelog fragments
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 tools/changelog.py check --base "origin/$BASE_REF"
          else
            python3 tools/changelog.py check
          fi
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # T-0232: FetchContent source trees (restored => no download); key = the pinned declarations.
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .fc-src
          key: fc-src-linux-core-${{ hashFiles('core/CMakeLists.txt', 'core/tests/CMakeLists.txt', 'app/**/CMakeLists.txt') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-core
      - name: Configure
        run: tools/ci/configure.sh -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCARVETTO_BUILD_APP=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
      # T-0122 AC1: the real carvetto-cli, DXF -> pocket + profile with tabs -> Grbl, checksum vs golden.
      - name: CLI end-to-end (DXF to Grbl G-code)
        run: |
          set -euo pipefail
          cli=build/app/cli/carvetto-cli
          d=app/cli/tests/data
          w=build/cli-e2e
          rm -rf "$w" && mkdir -p "$w"
          "$cli" import "$d/part.dxf" "$w/part.carv"
          "$cli" toolpath pocket "$d/pocket.json" "$w/part.carv" "$w/part.carv"
          "$cli" toolpath profile "$d/profile.json" "$w/part.carv" "$w/part.carv"
          "$cli" info "$w/part.carv"
          "$cli" post posts/grbl_mm.pp "$w/part.carv" "$w/part.nc"
          want=$(sha256sum core/tests/golden/cli/part_grbl.nc | cut -d' ' -f1)
          got=$(sha256sum "$w/part.nc" | cut -d' ' -f1)
          echo "golden sha256 $want, output sha256 $got"
          if [ "$want" != "$got" ]; then
            diff core/tests/golden/cli/part_grbl.nc "$w/part.nc" | head -40 || true
            echo "::error title=CLI end-to-end::G-code checksum differs from core/tests/golden/cli/part_grbl.nc"
            exit 1
          fi
      # T-0150 AC3: the same with drilling (peck + dwell) before the profile cut-out.
      - name: CLI end-to-end (DXF to Grbl G-code, drilling)
        run: |
          set -euo pipefail
          cli=build/app/cli/carvetto-cli
          d=app/cli/tests/data
          w=build/cli-e2e-drill
          rm -rf "$w" && mkdir -p "$w"
          "$cli" import "$d/part.dxf" "$w/part.carv"
          "$cli" toolpath drill "$d/drill.json" "$w/part.carv" "$w/part.carv"
          "$cli" toolpath profile "$d/profile.json" "$w/part.carv" "$w/part.carv"
          "$cli" info "$w/part.carv"
          "$cli" post posts/grbl_mm.pp "$w/part.carv" "$w/part.nc"
          want=$(sha256sum core/tests/golden/cli/part_drill_grbl.nc | cut -d' ' -f1)
          got=$(sha256sum "$w/part.nc" | cut -d' ' -f1)
          echo "golden sha256 $want, output sha256 $got"
          if [ "$want" != "$got" ]; then
            diff core/tests/golden/cli/part_drill_grbl.nc "$w/part.nc" | head -40 || true
            echo "::error title=CLI end-to-end (drilling)::G-code checksum differs from core/tests/golden/cli/part_drill_grbl.nc"
            exit 1
          fi
      # T-0151: quick engraving (V-bit raster fill in two passes, then a V-bit outline).
      - name: CLI end-to-end (DXF to Grbl G-code, quick engrave)
        run: |
          set -euo pipefail
          cli=build/app/cli/carvetto-cli
          d=app/cli/tests/data
          w=build/cli-e2e-engrave
          rm -rf "$w" && mkdir -p "$w"
          "$cli" import "$d/part.dxf" "$w/part.carv"
          "$cli" toolpath engrave "$d/engrave_fill.json" "$w/part.carv" "$w/part.carv"
          "$cli" toolpath engrave "$d/engrave_outline.json" "$w/part.carv" "$w/part.carv"
          "$cli" info "$w/part.carv"
          "$cli" post posts/grbl_mm.pp "$w/part.carv" "$w/part.nc"
          want=$(sha256sum core/tests/golden/cli/part_engrave_grbl.nc | cut -d' ' -f1)
          got=$(sha256sum "$w/part.nc" | cut -d' ' -f1)
          echo "golden sha256 $want, output sha256 $got"
          if [ "$want" != "$got" ]; then
            diff core/tests/golden/cli/part_engrave_grbl.nc "$w/part.nc" | head -40 || true
            echo "::error title=CLI end-to-end (quick engrave)::G-code checksum differs from core/tests/golden/cli/part_engrave_grbl.nc"
            exit 1
          fi
      # T-0153: V-carving (V-bit letters, then a flat-bottomed panel: end mill clearance, V-bit walls).
      - name: CLI end-to-end (DXF to Grbl G-code, V-carve)
        run: |
          set -euo pipefail
          cli=build/app/cli/carvetto-cli
          d=app/cli/tests/data
          w=build/cli-e2e-v-carve
          rm -rf "$w" && mkdir -p "$w"
          "$cli" import "$d/sign.dxf" "$w/sign.carv"
          "$cli" toolpath v_carve "$d/v_carve_letters.json" "$w/sign.carv" "$w/sign.carv"
          "$cli" toolpath v_carve "$d/v_carve_flat.json" "$w/sign.carv" "$w/sign.carv"
          "$cli" info "$w/sign.carv"
          "$cli" post posts/grbl_mm.pp "$w/sign.carv" "$w/sign.nc"
          want=$(sha256sum core/tests/golden/cli/sign_v_carve_grbl.nc | cut -d' ' -f1)
          got=$(sha256sum "$w/sign.nc" | cut -d' ' -f1)
          echo "golden sha256 $want, output sha256 $got"
          if [ "$want" != "$got" ]; then
            diff core/tests/golden/cli/sign_v_carve_grbl.nc "$w/sign.nc" | head -40 || true
            echo "::error title=CLI end-to-end (V-carve)::G-code checksum differs from core/tests/golden/cli/sign_v_carve_grbl.nc"
            exit 1
          fi
      # T-0014: timing-sensitive tests must hold under parallel load. Runs the suite with 8 jobs and
      # repeats it, failing as soon as any repetition fails: 5 times on main, 2 times on a PR
      # (the full 5x stress is what made PR runs take over an hour).
      - name: Test (parallel stress, -j8)
        env:
          REPEAT: ${{ github.event_name == 'pull_request' && '2' || '5' }}
        run: ctest --test-dir build --output-on-failure -j8 --repeat until-fail:$REPEAT

  # T-0159: the Release build runs on both runner images: ubuntu-24.04 (GCC 13) and ubuntu-26.04
  # (GCC 15; its Release build there contracts a * b - c into fma, for a reason the Compiler step reports), so results that depend on the
  # compiler's floating-point evaluation show up on a PR instead of when ubuntu-latest moves.
  linux-app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    name: linux-app (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1
      - name: Compiler
        run: |
          c++ --version | head -1
          c++ -Q --help=target | grep -E '^\s+-(march|mtune|mfma|mavx2)[= ]' || true
          echo "CXXFLAGS=${CXXFLAGS:-}"
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true
      # T-0232: FetchContent source trees (restored => no download); key = the pinned declarations.
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .fc-src
          key: fc-src-${{ matrix.os }}-${{ hashFiles('core/CMakeLists.txt', 'core/tests/CMakeLists.txt', 'app/**/CMakeLists.txt') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-app-${{ matrix.os }}
      - name: Configure
        run: tools/ci/configure.sh -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log || { echo "::error title=Build failed::$(grep -E 'error' build.log | head -25 | tr '\n' '|')"; exit 1; }
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
      - name: App self-test (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ -x build/app/carvetto ]; then build/app/carvetto --self-test || { echo "::error title=App self-test failed::exit $?"; exit 1; }; else echo "app not built yet - skipping"; fi

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja
        run: choco install ninja --no-progress -y
      # T-0232: FetchContent source trees (restored => no download); key = the pinned declarations.
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .fc-src
          key: fc-src-windows-${{ hashFiles('core/CMakeLists.txt', 'core/tests/CMakeLists.txt', 'app/**/CMakeLists.txt') }}
      - name: Configure
        shell: pwsh
        run: tools/ci/configure.ps1 -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: |
          cmake --build build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Select-String -Path build.log -Pattern 'error|warning C' | Select-Object -First 25 | ForEach-Object { $_.Line }) -join '%0A'
            Write-Host "::error title=Build failed::$tail"
            exit 1
          }
      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure -j4 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) {
            $fails = (Select-String -Path test.log -Pattern 'FAILED|Failed|failed|REQUIRE|CHECK|with expansion|==' | Select-Object -Last 40 | ForEach-Object { $_.Line }) -join '%0A'
            Write-Host "::error title=Tests failed::$fails"
            exit 1
          }
      # T-0122 AC1: the real carvetto-cli (MSVC build), DXF -> pocket + profile with tabs -> Grbl,
      # checksum vs the same golden as Linux.
      - name: CLI end-to-end (DXF to Grbl G-code)
        shell: pwsh
        run: |
          $cli = "build/app/cli/carvetto-cli.exe"
          $d = "app/cli/tests/data"
          $w = "build/cli-e2e"
          if (Test-Path $w) { Remove-Item -Recurse -Force $w }
          New-Item -ItemType Directory -Path $w | Out-Null
          $steps = @(
            @("import", "$d/part.dxf", "$w/part.carv"),
            @("toolpath", "pocket", "$d/pocket.json", "$w/part.carv", "$w/part.carv"),
            @("toolpath", "profile", "$d/profile.json", "$w/part.carv", "$w/part.carv"),
            @("info", "$w/part.carv"),
            @("post", "posts/grbl_mm.pp", "$w/part.carv", "$w/part.nc")
          )
          foreach ($a in $steps) {
            & $cli @a
            if ($LASTEXITCODE -ne 0) { Write-Host "::error title=CLI end-to-end::carvetto-cli $($a -join ' ') failed (exit $LASTEXITCODE)"; exit 1 }
          }
          $want = (Get-FileHash -Algorithm SHA256 core/tests/golden/cli/part_grbl.nc).Hash
          $got = (Get-FileHash -Algorithm SHA256 "$w/part.nc").Hash
          Write-Host "golden sha256 $want, output sha256 $got"
          if ($want -ne $got) {
            $diff = Compare-Object (Get-Content core/tests/golden/cli/part_grbl.nc) (Get-Content "$w/part.nc") | Select-Object -First 20 | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
            Write-Host "::error title=CLI end-to-end::G-code checksum differs from the golden%0A$($diff -join '%0A')"
            exit 1
          }
      # T-0150 AC3: the drilling pipeline (MSVC build), checksum vs the same golden as Linux.
      - name: CLI end-to-end (DXF to Grbl G-code, drilling)
        shell: pwsh
        run: |
          $cli = "build/app/cli/carvetto-cli.exe"
          $d = "app/cli/tests/data"
          $w = "build/cli-e2e-drill"
          if (Test-Path $w) { Remove-Item -Recurse -Force $w }
          New-Item -ItemType Directory -Path $w | Out-Null
          $steps = @(
            @("import", "$d/part.dxf", "$w/part.carv"),
            @("toolpath", "drill", "$d/drill.json", "$w/part.carv", "$w/part.carv"),
            @("toolpath", "profile", "$d/profile.json", "$w/part.carv", "$w/part.carv"),
            @("info", "$w/part.carv"),
            @("post", "posts/grbl_mm.pp", "$w/part.carv", "$w/part.nc")
          )
          foreach ($a in $steps) {
            & $cli @a
            if ($LASTEXITCODE -ne 0) { Write-Host "::error title=CLI end-to-end (drilling)::carvetto-cli $($a -join ' ') failed (exit $LASTEXITCODE)"; exit 1 }
          }
          $want = (Get-FileHash -Algorithm SHA256 core/tests/golden/cli/part_drill_grbl.nc).Hash
          $got = (Get-FileHash -Algorithm SHA256 "$w/part.nc").Hash
          Write-Host "golden sha256 $want, output sha256 $got"
          if ($want -ne $got) {
            $diff = Compare-Object (Get-Content core/tests/golden/cli/part_drill_grbl.nc) (Get-Content "$w/part.nc") | Select-Object -First 20 | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
            Write-Host "::error title=CLI end-to-end (drilling)::G-code checksum differs from the golden%0A$($diff -join '%0A')"
            exit 1
          }
      # T-0151: the quick engrave pipeline (MSVC build), checksum vs the same golden as Linux.
      - name: CLI end-to-end (DXF to Grbl G-code, quick engrave)
        shell: pwsh
        run: |
          $cli = "build/app/cli/carvetto-cli.exe"
          $d = "app/cli/tests/data"
          $w = "build/cli-e2e-engrave"
          if (Test-Path $w) { Remove-Item -Recurse -Force $w }
          New-Item -ItemType Directory -Path $w | Out-Null
          $steps = @(
            @("import", "$d/part.dxf", "$w/part.carv"),
            @("toolpath", "engrave", "$d/engrave_fill.json", "$w/part.carv", "$w/part.carv"),
            @("toolpath", "engrave", "$d/engrave_outline.json", "$w/part.carv", "$w/part.carv"),
            @("info", "$w/part.carv"),
            @("post", "posts/grbl_mm.pp", "$w/part.carv", "$w/part.nc")
          )
          foreach ($a in $steps) {
            & $cli @a
            if ($LASTEXITCODE -ne 0) { Write-Host "::error title=CLI end-to-end (quick engrave)::carvetto-cli $($a -join ' ') failed (exit $LASTEXITCODE)"; exit 1 }
          }
          $want = (Get-FileHash -Algorithm SHA256 core/tests/golden/cli/part_engrave_grbl.nc).Hash
          $got = (Get-FileHash -Algorithm SHA256 "$w/part.nc").Hash
          Write-Host "golden sha256 $want, output sha256 $got"
          if ($want -ne $got) {
            $diff = Compare-Object (Get-Content core/tests/golden/cli/part_engrave_grbl.nc) (Get-Content "$w/part.nc") | Select-Object -First 20 | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
            Write-Host "::error title=CLI end-to-end (quick engrave)::G-code checksum differs from the golden%0A$($diff -join '%0A')"
            exit 1
          }
      # T-0153: the V-carve pipeline (MSVC build), checksum vs the same golden as Linux.
      - name: CLI end-to-end (DXF to Grbl G-code, V-carve)
        shell: pwsh
        run: |
          $cli = "build/app/cli/carvetto-cli.exe"
          $d = "app/cli/tests/data"
          $w = "build/cli-e2e-v-carve"
          if (Test-Path $w) { Remove-Item -Recurse -Force $w }
          New-Item -ItemType Directory -Path $w | Out-Null
          $steps = @(
            @("import", "$d/sign.dxf", "$w/sign.carv"),
            @("toolpath", "v_carve", "$d/v_carve_letters.json", "$w/sign.carv", "$w/sign.carv"),
            @("toolpath", "v_carve", "$d/v_carve_flat.json", "$w/sign.carv", "$w/sign.carv"),
            @("info", "$w/sign.carv"),
            @("post", "posts/grbl_mm.pp", "$w/sign.carv", "$w/sign.nc")
          )
          foreach ($a in $steps) {
            & $cli @a
            if ($LASTEXITCODE -ne 0) { Write-Host "::error title=CLI end-to-end (V-carve)::carvetto-cli $($a -join ' ') failed (exit $LASTEXITCODE)"; exit 1 }
          }
          $want = (Get-FileHash -Algorithm SHA256 core/tests/golden/cli/sign_v_carve_grbl.nc).Hash
          $got = (Get-FileHash -Algorithm SHA256 "$w/sign.nc").Hash
          Write-Host "golden sha256 $want, output sha256 $got"
          if ($want -ne $got) {
            $diff = Compare-Object (Get-Content core/tests/golden/cli/sign_v_carve_grbl.nc) (Get-Content "$w/sign.nc") | Select-Object -First 20 | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
            Write-Host "::error title=CLI end-to-end (V-carve)::G-code checksum differs from the golden%0A$($diff -join '%0A')"
            exit 1
          }
      - name: App self-test (headless)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if (Test-Path build/app/carvetto.exe) {
            # carvetto.exe is a GUI-subsystem app: PowerShell does not wait for it unless asked.
            $p = Start-Process -FilePath build/app/carvetto.exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
            $msg = ((Get-Content selftest.out -ErrorAction SilentlyContinue) + (Get-Content selftest.err -ErrorAction SilentlyContinue)) -join '%0A'
            if ($p.ExitCode -ne 0) { Write-Host "::error title=App self-test failed (exit $($p.ExitCode))::$msg"; exit 1 }
            Write-Host "self-test passed: $msg"
          } else { Write-Host "app not built yet - skipping" }
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: carvetto-windows
          path: |
            build/app/carvetto.exe
            build/app/cli/carvetto-cli.exe
          if-no-files-found: warn
