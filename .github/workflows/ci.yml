name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']   # T-0352: release tags build the installer (path filters do not apply to tags)
    # Backlog/ADR-only commits to main change no code: do not spend four runner jobs on them.
    paths-ignore: ['docs/**']
  pull_request:

# Read-only by default; only the `release` job below raises it (T-0361).
permissions:
  contents: read

# A newer push to the same PR branch supersedes the older run: cancel it so stale runs do not
# starve the runner queue. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # T-0146: the changelog check compares with the PR's merge base
      # T-0146: entries live in changelog.d/ (one fragment per card), never in CHANGELOG.md.
      # `check` validates the fragments; on PRs `--base` compares CHANGELOG.md byte for byte with
      # the merge base: only an unchanged file, the exact output of `assemble` for the fragments
      # the PR deletes, or one inserted `## X.Y.Z` release heading pass (see changelog.d/README.md).
      - name: Changelog fragments
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 tools/changelog.py check --base "origin/$BASE_REF"
          else
            python3 tools/changelog.py check
          fi
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # T-0232: FetchContent source trees (restored => no download); key = the pinned declarations.
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .fc-src
          key: fc-src-linux-core-${{ hashFiles('core/CMakeLists.txt', 'core/tests/CMakeLists.txt', 'app/**/CMakeLists.txt') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-core
      - name: Configure
        run: tools/ci/configure.sh -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCARVETTO_BUILD_APP=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
      # T-0122 AC1: the real carvetto-cli, DXF -> pocket + profile with tabs -> Grbl, checksum vs golden.
      - name: CLI end-to-end (DXF to Grbl G-code)
        run: |
          set -euo pipefail
          cli=build/app/cli/carvetto-cli
          d=app/cli/tests/data
          w=build/cli-e2e
          rm -rf "$w" && mkdir -p "$w"
          "$cli" import "$d/part.dxf" "$w/part.carv"
          "$cli" toolpath pocket "$d/pocket.json" "$w/part.carv" "$w/part.carv"
          "$cli" toolpath profile "$d/profile.json" "$w/part.carv" "$w/part.carv"
          "$cli" info "$w/part.carv"
          "$cli" post posts/grbl_mm.pp "$w/part.carv" "$w/part.nc"
          want=$(sha256sum core/tests/golden/cli/part_grbl.nc | cut -d' ' -f1)
          got=$(sha256sum "$w/part.nc" | cut -d' ' -f1)
          echo "golden sha256 $want, output sha256 $got"
          if [ "$want" != "$got" ]; then
            diff core/tests/golden/cli/part_grbl.nc "$w/part.nc" | head -40 || true
            echo "::error title=CLI end-to-end::G-code checksum differs from core/tests/golden/cli/part_grbl.nc"
            exit 1
          fi
      # T-0150 AC3: the same with drilling (peck + dwell) before the profile cut-out.
      - name: CLI end-to-end (DXF to Grbl G-code, drilling)
        run: |
          set -euo pipefail
          cli=build/app/cli/carvetto-cli
          d=app/cli/tests/data
          w=build/cli-e2e-drill
          rm -rf "$w" && mkdir -p "$w"
          "$cli" import "$d/part.dxf" "$w/part.carv"
          "$cli" toolpath drill "$d/drill.json" "$w/part.carv" "$w/part.carv"
          "$cli" toolpath profile "$d/profile.json" "$w/part.carv" "$w/part.carv"
          "$cli" info "$w/part.carv"
          "$cli" post posts/grbl_mm.pp "$w/part.carv" "$w/part.nc"
          want=$(sha256sum core/tests/golden/cli/part_drill_grbl.nc | cut -d' ' -f1)
          got=$(sha256sum "$w/part.nc" | cut -d' ' -f1)
          echo "golden sha256 $want, output sha256 $got"
          if [ "$want" != "$got" ]; then
            diff core/tests/golden/cli/part_drill_grbl.nc "$w/part.nc" | head -40 || true
            echo "::error title=CLI end-to-end (drilling)::G-code checksum differs from core/tests/golden/cli/part_drill_grbl.nc"
            exit 1
          fi
      # T-0151: quick engraving (V-bit raster fill in two passes, then a V-bit outline).
      - name: CLI end-to-end (DXF to Grbl G-code, quick engrave)
        run: |
          set -euo pipefail
          cli=build/app/cli/carvetto-cli
          d=app/cli/tests/data
          w=build/cli-e2e-engrave
          rm -rf "$w" && mkdir -p "$w"
          "$cli" import "$d/part.dxf" "$w/part.carv"
          "$cli" toolpath engrave "$d/engrave_fill.json" "$w/part.carv" "$w/part.carv"
          "$cli" toolpath engrave "$d/engrave_outline.json" "$w/part.carv" "$w/part.carv"
          "$cli" info "$w/part.carv"
          "$cli" post posts/grbl_mm.pp "$w/part.carv" "$w/part.nc"
          want=$(sha256sum core/tests/golden/cli/part_engrave_grbl.nc | cut -d' ' -f1)
          got=$(sha256sum "$w/part.nc" | cut -d' ' -f1)
          echo "golden sha256 $want, output sha256 $got"
          if [ "$want" != "$got" ]; then
            diff core/tests/golden/cli/part_engrave_grbl.nc "$w/part.nc" | head -40 || true
            echo "::error title=CLI end-to-end (quick engrave)::G-code checksum differs from core/tests/golden/cli/part_engrave_grbl.nc"
            exit 1
          fi
      # T-0153: V-carving (V-bit letters, then a flat-bottomed panel: end mill clearance, V-bit walls).
      - name: CLI end-to-end (DXF to Grbl G-code, V-carve)
        run: |
          set -euo pipefail
          cli=build/app/cli/carvetto-cli
          d=app/cli/tests/data
          w=build/cli-e2e-v-carve
          rm -rf "$w" && mkdir -p "$w"
          "$cli" import "$d/sign.dxf" "$w/sign.carv"
          "$cli" toolpath v_carve "$d/v_carve_letters.json" "$w/sign.carv" "$w/sign.carv"
          "$cli" toolpath v_carve "$d/v_carve_flat.json" "$w/sign.carv" "$w/sign.carv"
          "$cli" info "$w/sign.carv"
          "$cli" post posts/grbl_mm.pp "$w/sign.carv" "$w/sign.nc"
          want=$(sha256sum core/tests/golden/cli/sign_v_carve_grbl.nc | cut -d' ' -f1)
          got=$(sha256sum "$w/sign.nc" | cut -d' ' -f1)
          echo "golden sha256 $want, output sha256 $got"
          if [ "$want" != "$got" ]; then
            diff core/tests/golden/cli/sign_v_carve_grbl.nc "$w/sign.nc" | head -40 || true
            echo "::error title=CLI end-to-end (V-carve)::G-code checksum differs from core/tests/golden/cli/sign_v_carve_grbl.nc"
            exit 1
          fi
      # T-0014: timing-sensitive tests must hold under parallel load. Runs the suite with 8 jobs and
      # repeats it, failing as soon as any repetition fails: 3 times on main (was 5 until the suite passed 2400 tests and a run took about two hours), 2 times on a PR
      # (the full 5x stress is what made PR runs take over an hour).
      - name: Test (parallel stress, -j8)
        env:
          REPEAT: ${{ github.event_name == 'pull_request' && '2' || '3' }}
        run: ctest --test-dir build --output-on-failure -j8 --repeat until-fail:$REPEAT

  # T-0159: the Release build runs on both runner images: ubuntu-24.04 (GCC 13) and ubuntu-26.04
  # (GCC 15; its Release build there contracts a * b - c into fma, for a reason the Compiler step reports), so results that depend on the
  # compiler's floating-point evaluation show up on a PR instead of when ubuntu-latest moves.
  linux-app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    name: linux-app (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1
      - name: Compiler
        run: |
          c++ --version | head -1
          c++ -Q --help=target | grep -E '^\s+-(march|mtune|mfma|mavx2)[= ]' || true
          echo "CXXFLAGS=${CXXFLAGS:-}"
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true
      # T-0232: FetchContent source trees (restored => no download); key = the pinned declarations.
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .fc-src
          key: fc-src-${{ matrix.os }}-${{ hashFiles('core/CMakeLists.txt', 'core/tests/CMakeLists.txt', 'app/**/CMakeLists.txt') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-app-${{ matrix.os }}
      - name: Configure
        run: tools/ci/configure.sh -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log || { echo "::error title=Build failed::$(grep -E 'error' build.log | head -25 | tr '\n' '|')"; exit 1; }
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
      - name: App self-test (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ -x build/app/carvetto ]; then build/app/carvetto --self-test || { echo "::error title=App self-test failed::exit $?"; exit 1; }; else echo "app not built yet - skipping"; fi

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja
        run: choco install ninja --no-progress -y
      # T-0232: FetchContent source trees (restored => no download); key = the pinned declarations.
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .fc-src
          key: fc-src-windows-${{ hashFiles('core/CMakeLists.txt', 'core/tests/CMakeLists.txt', 'app/**/CMakeLists.txt') }}
      - name: Configure
        shell: pwsh
        run: tools/ci/configure.ps1 -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: |
          cmake --build build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Select-String -Path build.log -Pattern 'error|warning C' | Select-Object -First 25 | ForEach-Object { $_.Line }) -join '%0A'
            Write-Host "::error title=Build failed::$tail"
            exit 1
          }
      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure -j4 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) {
            $fails = (Select-String -Path test.log -Pattern 'FAILED|Failed|failed|REQUIRE|CHECK|with expansion|==' | Select-Object -Last 40 | ForEach-Object { $_.Line }) -join '%0A'
            Write-Host "::error title=Tests failed::$fails"
            exit 1
          }
      # T-0122 AC1: the real carvetto-cli (MSVC build), DXF -> pocket + profile with tabs -> Grbl,
      # checksum vs the same golden as Linux.
      - name: CLI end-to-end (DXF to Grbl G-code)
        shell: pwsh
        run: |
          $cli = "build/app/cli/carvetto-cli.exe"
          $d = "app/cli/tests/data"
          $w = "build/cli-e2e"
          if (Test-Path $w) { Remove-Item -Recurse -Force $w }
          New-Item -ItemType Directory -Path $w | Out-Null
          $steps = @(
            @("import", "$d/part.dxf", "$w/part.carv"),
            @("toolpath", "pocket", "$d/pocket.json", "$w/part.carv", "$w/part.carv"),
            @("toolpath", "profile", "$d/profile.json", "$w/part.carv", "$w/part.carv"),
            @("info", "$w/part.carv"),
            @("post", "posts/grbl_mm.pp", "$w/part.carv", "$w/part.nc")
          )
          foreach ($a in $steps) {
            & $cli @a
            if ($LASTEXITCODE -ne 0) { Write-Host "::error title=CLI end-to-end::carvetto-cli $($a -join ' ') failed (exit $LASTEXITCODE)"; exit 1 }
          }
          $want = (Get-FileHash -Algorithm SHA256 core/tests/golden/cli/part_grbl.nc).Hash
          $got = (Get-FileHash -Algorithm SHA256 "$w/part.nc").Hash
          Write-Host "golden sha256 $want, output sha256 $got"
          if ($want -ne $got) {
            $diff = Compare-Object (Get-Content core/tests/golden/cli/part_grbl.nc) (Get-Content "$w/part.nc") | Select-Object -First 20 | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
            Write-Host "::error title=CLI end-to-end::G-code checksum differs from the golden%0A$($diff -join '%0A')"
            exit 1
          }
      # T-0150 AC3: the drilling pipeline (MSVC build), checksum vs the same golden as Linux.
      - name: CLI end-to-end (DXF to Grbl G-code, drilling)
        shell: pwsh
        run: |
          $cli = "build/app/cli/carvetto-cli.exe"
          $d = "app/cli/tests/data"
          $w = "build/cli-e2e-drill"
          if (Test-Path $w) { Remove-Item -Recurse -Force $w }
          New-Item -ItemType Directory -Path $w | Out-Null
          $steps = @(
            @("import", "$d/part.dxf", "$w/part.carv"),
            @("toolpath", "drill", "$d/drill.json", "$w/part.carv", "$w/part.carv"),
            @("toolpath", "profile", "$d/profile.json", "$w/part.carv", "$w/part.carv"),
            @("info", "$w/part.carv"),
            @("post", "posts/grbl_mm.pp", "$w/part.carv", "$w/part.nc")
          )
          foreach ($a in $steps) {
            & $cli @a
            if ($LASTEXITCODE -ne 0) { Write-Host "::error title=CLI end-to-end (drilling)::carvetto-cli $($a -join ' ') failed (exit $LASTEXITCODE)"; exit 1 }
          }
          $want = (Get-FileHash -Algorithm SHA256 core/tests/golden/cli/part_drill_grbl.nc).Hash
          $got = (Get-FileHash -Algorithm SHA256 "$w/part.nc").Hash
          Write-Host "golden sha256 $want, output sha256 $got"
          if ($want -ne $got) {
            $diff = Compare-Object (Get-Content core/tests/golden/cli/part_drill_grbl.nc) (Get-Content "$w/part.nc") | Select-Object -First 20 | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
            Write-Host "::error title=CLI end-to-end (drilling)::G-code checksum differs from the golden%0A$($diff -join '%0A')"
            exit 1
          }
      # T-0151: the quick engrave pipeline (MSVC build), checksum vs the same golden as Linux.
      - name: CLI end-to-end (DXF to Grbl G-code, quick engrave)
        shell: pwsh
        run: |
          $cli = "build/app/cli/carvetto-cli.exe"
          $d = "app/cli/tests/data"
          $w = "build/cli-e2e-engrave"
          if (Test-Path $w) { Remove-Item -Recurse -Force $w }
          New-Item -ItemType Directory -Path $w | Out-Null
          $steps = @(
            @("import", "$d/part.dxf", "$w/part.carv"),
            @("toolpath", "engrave", "$d/engrave_fill.json", "$w/part.carv", "$w/part.carv"),
            @("toolpath", "engrave", "$d/engrave_outline.json", "$w/part.carv", "$w/part.carv"),
            @("info", "$w/part.carv"),
            @("post", "posts/grbl_mm.pp", "$w/part.carv", "$w/part.nc")
          )
          foreach ($a in $steps) {
            & $cli @a
            if ($LASTEXITCODE -ne 0) { Write-Host "::error title=CLI end-to-end (quick engrave)::carvetto-cli $($a -join ' ') failed (exit $LASTEXITCODE)"; exit 1 }
          }
          $want = (Get-FileHash -Algorithm SHA256 core/tests/golden/cli/part_engrave_grbl.nc).Hash
          $got = (Get-FileHash -Algorithm SHA256 "$w/part.nc").Hash
          Write-Host "golden sha256 $want, output sha256 $got"
          if ($want -ne $got) {
            $diff = Compare-Object (Get-Content core/tests/golden/cli/part_engrave_grbl.nc) (Get-Content "$w/part.nc") | Select-Object -First 20 | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
            Write-Host "::error title=CLI end-to-end (quick engrave)::G-code checksum differs from the golden%0A$($diff -join '%0A')"
            exit 1
          }
      # T-0153: the V-carve pipeline (MSVC build), checksum vs the same golden as Linux.
      - name: CLI end-to-end (DXF to Grbl G-code, V-carve)
        shell: pwsh
        run: |
          $cli = "build/app/cli/carvetto-cli.exe"
          $d = "app/cli/tests/data"
          $w = "build/cli-e2e-v-carve"
          if (Test-Path $w) { Remove-Item -Recurse -Force $w }
          New-Item -ItemType Directory -Path $w | Out-Null
          $steps = @(
            @("import", "$d/sign.dxf", "$w/sign.carv"),
            @("toolpath", "v_carve", "$d/v_carve_letters.json", "$w/sign.carv", "$w/sign.carv"),
            @("toolpath", "v_carve", "$d/v_carve_flat.json", "$w/sign.carv", "$w/sign.carv"),
            @("info", "$w/sign.carv"),
            @("post", "posts/grbl_mm.pp", "$w/sign.carv", "$w/sign.nc")
          )
          foreach ($a in $steps) {
            & $cli @a
            if ($LASTEXITCODE -ne 0) { Write-Host "::error title=CLI end-to-end (V-carve)::carvetto-cli $($a -join ' ') failed (exit $LASTEXITCODE)"; exit 1 }
          }
          $want = (Get-FileHash -Algorithm SHA256 core/tests/golden/cli/sign_v_carve_grbl.nc).Hash
          $got = (Get-FileHash -Algorithm SHA256 "$w/sign.nc").Hash
          Write-Host "golden sha256 $want, output sha256 $got"
          if ($want -ne $got) {
            $diff = Compare-Object (Get-Content core/tests/golden/cli/sign_v_carve_grbl.nc) (Get-Content "$w/sign.nc") | Select-Object -First 20 | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
            Write-Host "::error title=CLI end-to-end (V-carve)::G-code checksum differs from the golden%0A$($diff -join '%0A')"
            exit 1
          }
      - name: App self-test (headless)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if (Test-Path build/app/carvetto.exe) {
            # carvetto.exe is a GUI-subsystem app: PowerShell does not wait for it unless asked.
            $p = Start-Process -FilePath build/app/carvetto.exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
            $msg = ((Get-Content selftest.out -ErrorAction SilentlyContinue) + (Get-Content selftest.err -ErrorAction SilentlyContinue)) -join '%0A'
            if ($p.ExitCode -ne 0) { Write-Host "::error title=App self-test failed (exit $($p.ExitCode))::$msg"; exit 1 }
            Write-Host "self-test passed: $msg"
          } else { Write-Host "app not built yet - skipping" }
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: carvetto-windows
          path: |
            build/app/carvetto.exe
            build/app/cli/carvetto-cli.exe
          if-no-files-found: warn

  # T-0352: Windows installer (CPack NSIS, ADR-0120). Separate from windows-app so the existing jobs
  # are unaffected. Runs on main, on version tags, on demand, and on PRs from task/T-0352* branches
  # or labelled `packaging` (it is a long job; ordinary PRs skip it). It installs the artifact silently,
  # runs `carvetto --self-test` from the installed copy, then uninstalls and checks nothing is left.
  windows-installer:
    if: >-
      github.event_name != 'pull_request'
      || startsWith(github.head_ref, 'task/T-0352')
      || contains(github.event.pull_request.labels.*.name, 'packaging')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja
        run: choco install ninja --no-progress -y
      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --no-progress -y
          }
          if (Test-Path 'C:\Program Files (x86)\NSIS') { "C:\Program Files (x86)\NSIS" | Out-File -Append -Encoding ascii $env:GITHUB_PATH }
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .fc-src
          key: fc-src-windows-installer-${{ hashFiles('core/CMakeLists.txt', 'core/tests/CMakeLists.txt', 'app/**/CMakeLists.txt') }}
      - name: Configure
        shell: pwsh
        run: tools/ci/configure.ps1 -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCARVETTO_BUILD_TESTS=OFF
      - name: Build
        shell: pwsh
        run: |
          cmake --build build
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Build failed::cmake --build exit $LASTEXITCODE"; exit 1 }
      - name: Package (CPack NSIS)
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -G NSIS -B dist
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=CPack failed::exit $LASTEXITCODE"; exit 1 }
          Get-ChildItem dist -Filter *.exe | Format-Table Name, Length
          if (-not (Get-ChildItem dist -Filter 'Carvetto-*-win64.exe')) { Write-Host "::error title=CPack::no installer produced"; exit 1 }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: carvetto-windows-installer
          path: dist/Carvetto-*-win64.exe
          if-no-files-found: error
      - name: Silent install
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist -Filter 'Carvetto-*-win64.exe' | Select-Object -First 1).FullName
          # NSIS: /S silent; /D= must be last and unquoted.
          $p = Start-Process -FilePath $setup -ArgumentList '/S', '/D=C:\carvetto-inst' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error title=Install failed::installer exit $($p.ExitCode)"; exit 1 }
          Get-ChildItem C:\carvetto-inst -Recurse -File | Measure-Object | ForEach-Object { Write-Host "$($_.Count) files installed" }
          $need = 'bin\carvetto.exe', 'bin\carvetto-cli.exe', 'bin\Qt6Widgets.dll', 'plugins\platforms\qwindows.dll', 'bin\qt.conf', 'Uninstall.exe',
                  'share\carvetto\posts\grbl_mm.pp', 'share\carvetto\gadgets', 'share\carvetto\tooldb\starter_tools.json',
                  'share\carvetto\licenses\LICENSE', 'share\carvetto\licenses\THIRD_PARTY_NOTICES.md'
          $missing = $need | Where-Object { -not (Test-Path (Join-Path 'C:\carvetto-inst' $_)) }
          if ($missing) { Write-Host "::error title=Installed files missing::$($missing -join ', ')"; exit 1 }
          if (-not (Test-Path 'HKLM:\Software\Classes\.carv')) { Write-Host "::error title=File association missing::.carv key not written"; exit 1 }
          if (-not (Get-ChildItem 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Carvetto' -Filter *.lnk -ErrorAction SilentlyContinue)) {
            Write-Host "::error title=Start menu entry missing::no shortcut under Programs\Carvetto"; exit 1
          }
      - name: Installed app self-test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Run from an unrelated directory with Qt removed from PATH: only the installed copy may supply DLLs.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Qt' }) -join ';'
          Set-Location $env:TEMP
          $p = Start-Process -FilePath C:\carvetto-inst\bin\carvetto.exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          $msg = ((Get-Content selftest.out -ErrorAction SilentlyContinue) + (Get-Content selftest.err -ErrorAction SilentlyContinue)) -join '%0A'
          if ($p.ExitCode -ne 0) { Write-Host "::error title=Installed app self-test failed (exit $($p.ExitCode))::$msg"; exit 1 }
          Write-Host "self-test passed: $msg"
      - name: Uninstall and check nothing is left
        shell: pwsh
        run: |
          # _?= keeps the uninstaller in place and makes it synchronous; remove it afterwards.
          $p = Start-Process -FilePath C:\carvetto-inst\Uninstall.exe -ArgumentList '/S', '_?=C:\carvetto-inst' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error title=Uninstall failed::exit $($p.ExitCode)"; exit 1 }
          $left = @(Get-ChildItem C:\carvetto-inst -Recurse -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne 'Uninstall.exe' })
          if ($left.Count -gt 0) {
            Write-Host "::error title=Uninstall left files behind::$((($left | Select-Object -First 20 | ForEach-Object { $_.FullName }) -join '%0A'))"; exit 1
          }
          if (Test-Path 'HKLM:\Software\Classes\.carv') { Write-Host "::error title=Uninstall left the .carv association::"; exit 1 }
          if (Test-Path 'HKLM:\Software\Classes\Carvetto.Document') { Write-Host "::error title=Uninstall left the Carvetto.Document key::"; exit 1 }
          if (Test-Path 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Carvetto') { Write-Host "::error title=Uninstall left the Start menu folder::"; exit 1 }
          Write-Host "uninstall clean"

  # T-0353: Linux packages (CPack DEB and RPM, AppImage; ADR-0124). Separate from linux-app so the existing jobs are
  # unaffected. Runs on main, on version tags, on demand, and on PRs from task/T-0353* branches or labelled
  # `packaging`. Qt is bundled, so the runner's Qt environment variables are removed before every installed run.
  linux-packages:
    if: >-
      github.event_name != 'pull_request'
      || startsWith(github.head_ref, 'task/T-0353')
      || contains(github.event.pull_request.labels.*.name, 'packaging')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1 rpm squashfs-tools patchelf desktop-file-utils shared-mime-info xdg-utils
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .fc-src
          key: fc-src-linux-packages-${{ hashFiles('core/CMakeLists.txt', 'core/tests/CMakeLists.txt', 'app/**/CMakeLists.txt') }}
      - name: Configure
        run: tools/ci/configure.sh -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCARVETTO_BUNDLE_QT=ON -DCARVETTO_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build
      - name: Package (CPack DEB and RPM)
        run: |
          cpack --config build/CPackConfig.cmake -B dist || { echo "::error title=CPack failed::exit $?"; exit 1; }
          ls -l dist
          test -f dist/carvetto_*_amd64.deb || { echo "::error title=CPack::no DEB produced"; exit 1; }
          test -f dist/carvetto-*.x86_64.rpm || { echo "::error title=CPack::no RPM produced"; exit 1; }
          dpkg-deb --info dist/carvetto_*_amd64.deb
          dpkg-deb --contents dist/carvetto_*_amd64.deb | grep -E 'usr/(bin/carvetto|bin/qt.conf|lib/carvetto/lib/libQt6Core|lib/carvetto/plugins/platforms/libqxcb|share/applications/carvetto.desktop|share/mime/packages/carvetto.xml|share/carvetto/posts/grbl_mm.pp)' | tee deb-key.txt
          test "$(wc -l < deb-key.txt)" -ge 7 || { echo "::error title=DEB contents::expected files missing"; exit 1; }
          rpm -qpl dist/carvetto-*.x86_64.rpm | grep -E 'bin/carvetto$|carvetto.desktop|libQt6Core' || { echo "::error title=RPM contents::expected files missing"; exit 1; }
          rpm -qp --requires dist/carvetto-*.x86_64.rpm
      - name: Validate desktop entry
        run: desktop-file-validate packaging/linux/carvetto.desktop
      - name: Install the DEB
        run: sudo apt-get install -y ./dist/carvetto_*_amd64.deb
      - name: Installed app self-test (DEB)
        run: |
          # Only the installed copy may supply Qt: drop the runner's Qt environment, run from an unrelated directory.
          unset LD_LIBRARY_PATH QT_PLUGIN_PATH QT_ROOT_DIR Qt6_DIR QT_QPA_PLATFORM_PLUGIN_PATH
          cd "$RUNNER_TEMP"
          if ldd /usr/bin/carvetto | grep 'not found'; then echo "::error title=Unresolved libraries in the installed app::see log"; exit 1; fi
          ldd /usr/bin/carvetto | grep -E 'libQt6Core' | grep -q 'lib/carvetto/lib/libQt6Core' || { echo "::error title=Qt not taken from the package::see ldd"; ldd /usr/bin/carvetto; exit 1; }
          ldd /usr/lib/carvetto/plugins/platforms/libqxcb.so | grep -E 'not found' && { echo "::error title=xcb plugin has unresolved libraries::see log"; exit 1; } || true
          ldd /usr/lib/carvetto/plugins/platforms/libqxcb.so | grep -q 'libQt6XcbQpa.*/carvetto/' || { echo "::error title=xcb plugin does not use the bundled Qt::see ldd"; ldd /usr/lib/carvetto/plugins/platforms/libqxcb.so; exit 1; }
          QT_QPA_PLATFORM=offscreen /usr/bin/carvetto --self-test || { echo "::error title=Installed app self-test failed::exit $?"; exit 1; }
          echo 'x' > "$RUNNER_TEMP/a.carv"
          # The installed MIME database (written by the postinst / shared-mime-info trigger) must map *.carv.
          grep -q 'application/x-carvetto-project:\*\.carv' /usr/share/mime/globs2 || { echo "::error title=MIME type not registered::.carv missing from /usr/share/mime/globs2"; exit 1; }
          # xdg-mime may fall back to file(1) on a headless runner, so this one only reports.
          xdg-mime query filetype "$RUNNER_TEMP/a.carv" || true
      - name: Remove the DEB and check nothing is left
        run: |
          sudo apt-get remove -y carvetto
          left=$(find /usr/lib/carvetto /usr/share/carvetto /usr/bin/carvetto /usr/share/applications/carvetto.desktop -print 2>/dev/null || true)
          if [ -n "$left" ]; then echo "::error title=Removal left files::$(echo "$left" | head -20 | tr '\n' '|')"; exit 1; fi
          if grep -q 'application/x-carvetto-project' /usr/share/mime/globs2; then echo "::error title=Removal left the MIME registration::globs2"; exit 1; fi
      - name: Build the AppImage
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          packaging/linux/make-appimage.sh build dist "$PWD/appimagetool"
          ls -l dist
          test -f dist/Carvetto-*-x86_64.AppImage || { echo "::error title=AppImage::not produced"; exit 1; }
      - name: AppImage self-test
        run: |
          unset LD_LIBRARY_PATH QT_PLUGIN_PATH QT_ROOT_DIR Qt6_DIR QT_QPA_PLATFORM_PLUGIN_PATH
          cd "$RUNNER_TEMP"
          # --appimage-extract-and-run: the runner has no FUSE for mounting.
          QT_QPA_PLATFORM=offscreen "$GITHUB_WORKSPACE"/dist/Carvetto-*-x86_64.AppImage --appimage-extract-and-run --self-test || { echo "::error title=AppImage self-test failed::exit $?"; exit 1; }
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: carvetto-linux-packages
          path: |
            dist/carvetto_*_amd64.deb
            dist/carvetto-*.x86_64.rpm
            dist/Carvetto-*-x86_64.AppImage
          if-no-files-found: error

  # T-0361: publish a GitHub Release from a v* tag. Runs only for tag pushes, after both packaging jobs
  # succeeded (both run on tags: their `if:` only excludes unlabelled pull requests). Downloads their
  # artifacts, writes SHA256SUMS, takes the notes from the `## X.Y.Z` section of CHANGELOG.md
  # (tools/release_notes.py) and creates the release, or updates it when it already exists so that
  # re-running the workflow does not fail. The only job with write permission.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows-installer, linux-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download packaging artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: carvetto-*
          path: release-assets
          merge-multiple: true
      - name: Collect assets and checksums
        run: |
          cd release-assets
          ls -l
          for pat in 'Carvetto-*-win64.exe' 'carvetto_*_amd64.deb' 'carvetto-*.x86_64.rpm' 'Carvetto-*-x86_64.AppImage'; do
            # shellcheck disable=SC2086
            ls $pat >/dev/null 2>&1 || { echo "::error title=Missing asset::no file matches $pat"; exit 1; }
          done
          sha256sum Carvetto-*-win64.exe carvetto_*_amd64.deb carvetto-*.x86_64.rpm Carvetto-*-x86_64.AppImage > SHA256SUMS
          cat SHA256SUMS
      - name: Extract release notes
        run: python3 -I tools/release_notes.py "$TAG" --output release-notes.md
      - name: Create or update the release
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Carvetto ${TAG#v}" --notes-file release-notes.md "${prerelease[@]}"
          else
            gh release create "$TAG" --verify-tag --title "Carvetto ${TAG#v}" --notes-file release-notes.md "${prerelease[@]}" \
              || gh release view "$TAG" >/dev/null   # lost a creation race: the release exists now, upload below
          fi
          gh release upload "$TAG" release-assets/* --clobber
