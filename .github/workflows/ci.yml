name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCARVETTO_BUILD_APP=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content configure.log -Tail 40) -join '%0A'
            Write-Host "::error title=CMake configure failed::$tail"
            exit 1
          }
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Select-String -Path build.log -Pattern 'error|warning C' | Select-Object -First 25 | ForEach-Object { $_.Line }) -join '%0A'
            Write-Host "::error title=Build failed::$tail"
            exit 1
          }
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: carvetto-windows
          path: build/app/Release/
