  <title>Carvetto</title>
  <rect x="16" y="16" width="224" height="224" rx="44" fill="#1f3a4d"/>
  <!-- wood-coloured stock with a carved channel -->
  <path d="M40 150 H216 V200 a12 12 0 0 1 -12 12 H52 a12 12 0 0 1 -12 -12 Z" fill="#d9a35f"/>
  <path d="M40 150 H98 Q128 196 158 150 H216 V164 H168 Q128 214 88 164 H40 Z" fill="#8a5a2b"/>
  <!-- V-bit: shank and cutting cone pointing down into the channel -->
  <rect x="112" y="30" width="32" height="64" rx="6" fill="#c9d3da"/>
  <path d="M106 94 H150 L128 160 Z" fill="#f0f4f6"/>
  <path d="M128 94 H150 L128 160 Z" fill="#aab6bf"/>
